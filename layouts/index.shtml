<extend template="base.shtml">
<title id="title" :text="$page.title"></title>
<head id="head">
	<style>
		#page h1,
		#page h2 {
			text-align: left;
		}
		
		#page h1 {
			font-size: 1.7rem;
			border-bottom: 1px dashed #aaa;
			margin-top: 2em;
		}
		
		#page h2 {
			font-size: 1.5rem;
		}
		
		#page h3 {
			font-size: 1rem;
		}
		
		.title,
		.subtitle {
			margin-bottom: 0;
		}
		
		.subtitle,
		.tagline {
			margin-top: 0;
		}
		
		.title {
			font-size: 4rem;
			margin-top: 1rem;
		}
		
		.subtitle {
			font-size: 2rem;
		}
		
		.tagline {
			font-size: 1rem;
			font-style: italic;
			border-top: 1px solid #ccc;
			border-bottom: 1px solid #ccc;
			padding: 2px 5px;
			text-align: center;
		}
		
		.get-started {
			font-family: 'Bebas Neue', sans-serif;
			font-weight: normal;
			font-size: 2rem;
			text-align: center;
			margin: 1em;
		}
		
		.get-started a {
			color: #111;
			font-weight: normal;
			background-color: #f7a41d;
			border: 1px solid #f7a41d;
			padding: 3px 10px;
			text-decoration: none;
		}
		
		.get-started a:hover {
			background-color: #ffb84d;
		}
	</style>
</head>
<div id="content">
	<h1 class="centered title">SIBL</h1>
	<h2 class="centered subtitle">Something is Better Linker</h2>
	<p class="centered tagline">
		A fast, lightweight, zero-dependency linker written in Zig.
	</p>
	<div class="get-started"><a href="$site.page('getting-started').link()">Get Started</a></div>
	<div id="page" :html="$page.content()"></div>
</div>
