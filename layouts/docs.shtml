<extend template="base.shtml">
<title id="title" :text="$page.title"></title>
<head id="head">
	<style>
		#content {
			max-width: 1120px;
		}

		#page h1, #page h2 { text-align: left; }
		#page h1 {
			font-size: 1.8rem;
			border-bottom: none;
			border-left: 3px solid #f7a41d;
			padding-left: 0.75rem;
			margin-top: 0.5rem;
			margin-bottom: 1rem;
		}
		#page h2 {
			font-size: 1.45rem;
			margin-top: 1.75rem;
			border-bottom: 1px dashed #444;
			padding-bottom: 0.25rem;
		}
		#page h3 { font-size: 1.1rem; }
		#page { margin-top: 0.25rem; }

		.docs-shell {
			display: grid;
			grid-template-columns: 236px minmax(0, 1fr);
			gap: 2.4rem;
			align-items: start;
			margin-top: 0.25rem;
		}

		.docs-sidebar {
			position: sticky;
			top: 1rem;
			align-self: start;
			max-height: calc(100vh - 2rem);
			overflow-y: auto;
			padding-right: 0.35rem;
		}

		.docs-toggle-input {
			position: absolute;
			width: 1px;
			height: 1px;
			opacity: 0;
			pointer-events: none;
		}

		.docs-toggle-label {
			display: none;
			align-items: center;
			gap: 0.55rem;
			width: 100%;
			min-height: 44px;
			padding: 0.65rem 0.85rem;
			border: 1px dashed #333;
			background: #151515;
			color: #eaeaea;
			font-family: 'Bebas Neue', sans-serif;
			font-size: 1.15rem;
			letter-spacing: 0.05em;
			cursor: pointer;
			user-select: none;
		}
		.docs-toggle-label:hover { color: #f7a41d; border-color: #c8871a; }
		.docs-toggle-input:focus-visible + .docs-toggle-label {
			outline: 1px dashed #f7a41d;
			outline-offset: 3px;
		}
		.docs-toggle-input:checked + .docs-toggle-label {
			border-color: #c8871a;
			color: #f7a41d;
		}

		.docs-sidebar-inner { display: block; }

		.docs-sidebar-title {
			margin: 0 0 0.65rem;
			font-family: 'Bebas Neue', sans-serif;
			font-size: 1.35rem;
			letter-spacing: 0.06em;
			color: #f7a41d;
			text-align: left;
		}

		.docs-nav {
			display: flex;
			flex-direction: column;
			gap: 0.1rem;
			border-left: 1px dashed #2e2e2e;
		}

		.docs-nav-link {
			display: block;
			margin-left: -1px;
			padding: 0.5rem 0.75rem;
			border-left: 2px solid transparent;
			color: #bbb;
			font-family: 'Merriweather', serif;
			font-size: 0.93rem;
			font-weight: 400;
			line-height: 1.35;
			text-decoration: none;
		}
		.docs-nav-link:hover {
			color: #f7a41d;
			background: rgba(247,164,29,0.04);
			border-left-color: #c8871a;
		}
		.docs-nav-link.is-active {
			color: #f7a41d;
			background: rgba(247,164,29,0.07);
			border-left-color: #f7a41d;
			font-weight: 700;
		}

		.docs-nav-divider {
			height: 0;
			margin: 0.55rem 0.75rem;
			border-top: 1px dashed #2e2e2e;
		}

		.docs-main { min-width: 0; }

		.docs-pager {
			display: flex;
			align-items: stretch;
			gap: 1rem;
			margin-top: 2.75rem;
			padding-top: 1.25rem;
			border-top: 1px dashed #333;
		}
		.docs-pager-slot { flex: 1 1 0; min-width: 0; }
		.docs-pager-slot-next { margin-left: auto; }

		.docs-pager-link {
			display: flex;
			flex-direction: column;
			gap: 0.2rem;
			height: 100%;
			padding: 0.8rem 1rem;
			border: 1px dashed #3a3a3a;
			background: #151515;
			text-decoration: none;
		}
		.docs-pager-link:hover {
			border-color: #c8871a;
			background: #191919;
			color: #f7a41d;
		}
		.docs-pager-next { text-align: right; }
		.docs-pager-label {
			color: #888;
			font-family: 'Bebas Neue', sans-serif;
			font-size: 0.95rem;
			letter-spacing: 0.08em;
		}
		.docs-pager-link:hover .docs-pager-label { color: #f7a41d; }
		.docs-pager-title {
			color: #eaeaea;
			font-family: 'Merriweather', serif;
			font-size: 0.95rem;
			font-weight: 700;
			line-height: 1.4;
			overflow-wrap: anywhere;
		}

		@media (max-width: 820px) {
			.docs-shell {
				grid-template-columns: minmax(0, 1fr);
				gap: 1.15rem;
			}
			.docs-sidebar {
				position: static;
				max-height: none;
				overflow: visible;
				padding-right: 0;
			}
			.docs-toggle-label { display: flex; }
			.docs-sidebar-inner {
				display: none;
				padding-top: 0.85rem;
				border-bottom: 1px dashed #2e2e2e;
				padding-bottom: 0.85rem;
			}
			.docs-toggle-input:checked ~ .docs-sidebar-inner { display: block; }
		}

		@media (max-width: 560px) {
			.docs-pager {
				flex-direction: column;
				gap: 0.75rem;
			}
			.docs-pager-slot { width: 100%; }
			.docs-pager-next { text-align: left; }
			.docs-pager-link { width: 100%; }
		}
	</style>
</head>
<div id="content">
	<div class="docs-shell">
		<aside class="docs-sidebar" aria-label="Documentation">
			<input class="docs-toggle-input" type="checkbox" id="docs-nav-toggle">
			<label class="docs-toggle-label" for="docs-nav-toggle">
				<i class="fa-solid fa-bars"></i>
				<span>Documentation menu</span>
			</label>
			<div class="docs-sidebar-inner">
				<p class="docs-sidebar-title">Documentation</p>
				<nav class="docs-nav">
					<a class="$site.page('docs').isCurrent().then('docs-nav-link is-active', 'docs-nav-link')" href="$site.page('docs').link()">
						Overview
					</a>
					<ctx :loop="$site.page('docs').subpagesAlphabetic()">
						<a class="$loop.it.isCurrent().then('docs-nav-link is-active', 'docs-nav-link')" href="$loop.it.link()">
							<span :text="$loop.it.title"></span>
						</a>
					</ctx>
					<div class="docs-nav-divider"></div>
					<a class="docs-nav-link" href="$site.page('roadmap').link()">Roadmap</a>
					<a class="docs-nav-link" href="https://github.com/zig-foundry/sibl" target="_blank">Source code</a>
				</nav>
			</div>
		</aside>
		<main class="docs-main">
			<div id="page" :html="$page.content()"></div>
			<ctx :if="$page.isSection().not()">
				<nav class="docs-pager" aria-label="Documentation pages">
					<div class="docs-pager-slot">
						<ctx :if="$page.prevPage?()">
							<a class="docs-pager-link" href="$if.link()">
								<span class="docs-pager-label">← Previous</span>
								<span class="docs-pager-title" :text="$if.title"></span>
							</a>
						</ctx>
					</div>
					<div class="docs-pager-slot docs-pager-slot-next">
						<ctx :if="$page.nextPage?()">
							<a class="docs-pager-link docs-pager-next" href="$if.link()">
								<span class="docs-pager-label">Next →</span>
								<span class="docs-pager-title" :text="$if.title"></span>
							</a>
						</ctx>
					</div>
				</nav>
			</ctx>
		</main>
	</div>
</div>
